<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Billetera</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Billetera">
<meta name="theme-color" content="#12161a">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>
:root{--bg:#12161a;--card:#222a30;--line:#2f3941;--tx:#eef3f5;--mu:#8d99a1;--blue:#5db4fb;--red:#ec7480;--grn:#6fdca5}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{background:var(--bg);color:var(--tx);font:16px/1.35 ui-rounded,-apple-system,"SF Pro Rounded","Segoe UI",sans-serif}
body{background:linear-gradient(#27343e 0,var(--bg) 360px) no-repeat var(--bg);min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 112px)}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-size:15px;font-weight:600;color:var(--mu)}
.rb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--tx);font-size:18px}
.hero{text-align:center;margin:10px 0 22px}
.hero small{color:var(--mu);font-size:15px}
.hero b{display:block;font-size:46px;font-weight:700;letter-spacing:-1px;margin-top:2px}
.hero .usd{color:var(--mu);font-size:16px;margin-top:2px}
.card{background:var(--card);border-radius:24px;padding:16px;margin-bottom:14px}
.card h2{font-size:15px;font-weight:600;color:var(--mu);margin-bottom:12px}
.card .nota{color:var(--mu);font-size:13px;margin:-6px 0 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.two .card{margin:0}
.two small{color:var(--mu);font-size:14px}
.two b{display:block;font-size:22px;margin-top:4px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .g{flex:1;min-width:0}
.row .g div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--mu);font-size:13px}
.r{text-align:right;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.ic{width:42px;height:42px;border-radius:14px;background:#2d373e;display:grid;place-items:center;font-weight:700;flex:none}
.ic.late{background:rgba(236,116,128,.18);color:var(--red)}
.pos{color:var(--grn)}
.neg{color:var(--red)}
.neu{color:var(--mu)}
.dn{color:var(--mu);font-size:14px;margin:16px 4px 6px}
.dn::first-letter{text-transform:uppercase}
.cdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.donut{position:relative;width:200px;height:200px;margin:0 auto 14px}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .c b{font-size:22px;display:block}
.tools{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.chip,select,input{border:0;background:var(--card);color:var(--tx);font:inherit;font-size:15px;border-radius:999px;padding:10px 16px;flex:none}
.chip.on{background:#e9eef1;color:#12161a;font-weight:600}
select{appearance:none;-webkit-appearance:none}
input{width:100%;margin-bottom:6px}
input::placeholder{color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.empty b{display:block;color:var(--tx);margin-bottom:4px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:calc(100% - 24px);max-width:496px;display:flex;gap:2px;padding:6px;border-radius:32px;background:rgba(36,45,51,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line)}
nav button{flex:1;border:0;background:none;color:var(--tx);border-radius:26px;padding:8px 0 7px;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{background:#0d1114;font-weight:600}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:5}
#sheet.on{display:flex}
#sheet .p{width:100%;max-width:520px;margin:0 auto;background:#1d252b;border-radius:28px 28px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 22px)}
#sheet .p h2{font-size:15px;color:var(--mu);margin:0 4px 8px}
#sheet .p button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--tx);font:inherit;padding:14px 4px;border-top:1px solid var(--line)}
#sheet .p h2+button{border-top:0}
.seg{display:flex;gap:4px;background:var(--card);border-radius:999px;padding:4px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:15px;border-radius:999px;padding:8px 0}
.seg button.on{background:#e9eef1;color:#12161a;font-weight:600}
.prog{height:8px;border-radius:99px;background:#2d373e;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-of-type{border-top:0}
.kv span{color:var(--mu)}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin:6px 0 4px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bars i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:#3a4a56;min-height:3px}
.bars div.on i{background:var(--blue)}
.bars small{color:var(--mu);font-size:11px;margin-top:5px}
.tag{display:inline-block;font-size:12px;border-radius:99px;padding:2px 8px;background:#2d373e;color:var(--mu);margin-left:6px;vertical-align:1px}
.tag.red{background:rgba(236,116,128,.18);color:var(--red)}
.tag.blue{background:rgba(93,180,251,.16);color:var(--blue)}
/* Categoría tocable -> Movimientos filtrados */
.tap{cursor:pointer}
.tap:active{opacity:.6}
.tap .g div:first-child::after{content:' ›';color:var(--mu)}
.bars div{cursor:default}
.bars.tap div{cursor:pointer}
.ic svg{width:34px;height:34px;display:block}
.ic.logo{background:#2d373e}
/* Calendario de Movimientos */
.cal{padding:14px 12px 10px}
.cal .wd,.cal .ds{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal .wd span{color:var(--mu);font-size:12px;padding-bottom:6px}
.cal .ds button{position:relative;border:0;background:none;color:var(--tx);font:inherit;font-size:15px;height:40px;margin:1px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.cal .ds button:disabled{color:#4f5c65}
.cal .ds button.hoy{box-shadow:inset 0 0 0 1.5px var(--line)}
.cal .ds button.on{background:#e9eef1;color:#12161a;font-weight:600}
.cal .ds i{display:flex;gap:2px;height:4px}
.cal .ds i b{width:4px;height:4px;border-radius:50%}
.cal .ds button:not(:disabled):active{opacity:.6}

.card.flash{animation:flash 1.2s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 2px var(--blue)}100%{box-shadow:0 0 0 2px transparent}}
.chip.cat{display:flex;align-items:center;gap:6px}
.chip.cat .x{opacity:.55;margin-left:2px}
details summary{list-style:none;cursor:pointer;color:var(--mu);font-size:15px;font-weight:600}
details summary::-webkit-details-marker{display:none}
details[open] summary{margin-bottom:8px}
</style>
</head>
<body>
<div id="app">
  <header><h1 id="ttl">Inicio</h1><button class="rb" aria-label="Actualizar" onclick="go(S.tab,true)">&#8635;</button></header>
  <main id="view"></main>
</div>
<nav id="nav"></nav>
<div id="sheet" onclick="if(event.target===this)menu(false)"><div class="p" id="menu"></div></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(n,m)=>(n<0?'−':'')+(m==='USD'?'US$ ':'$')+Math.abs(n).toLocaleString('es-AR',{maximumFractionDigits:m==='USD'?2:0});
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
const mesTxt=k=>{const p=k.split('-');return cap(new Date(p[0],p[1]-1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'}))};
const diaTxt=f=>{const p=f.split('-');return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})};
const corto=f=>{const p=f.split('-');return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('es-AR',{day:'numeric',month:'short'})};
/* ---------- Conexión con Apps Script (URL + clave guardadas en este iPhone) ---------- */
const CFG={get(k){try{return localStorage.getItem('billetera_'+k)||''}catch(e){return ''}},set(k,v){try{localStorage.setItem('billetera_'+k,v)}catch(e){}}};
// Nombre de la función de Apps Script -> [fn de la API, parámetros]
const API={App_inicio:['inicio',['fresh']],App_movimientos:['movimientos',['mes','fresh']],App_vencimientos:['vencimientos',['fresh']],App_cuotas:['cuotas',['fresh']],App_prestamo:['prestamo',['fresh']],App_activos:['activos',['fresh']],App_ipc:['ipc',['fresh']],App_super:['super',['fresh']],App_resumenAnual:['resumenAnual',['fresh']],App_salario:['salario',['fresh']],App_cuotasMes:['cuotasMes',['mes','fresh']],App_cuotasPorMes:['cuotasPorMes',['fresh']],App_superMes:['superMes',['fresh']]};
async function run(fn,...a){
  const url=CFG.get('url'),key=CFG.get('key');
  if(!url||!key){config();throw new Error('Falta configurar la conexión')}
  const m=API[fn],q=new URLSearchParams({fn:m[0],key:key});
  m[1].forEach((p,i)=>{if(p==='fresh'){if(a[i])q.set('fresh','1')}else if(a[i])q.set(p,a[i])});
  let r;
  try{r=await fetch(url+(url.includes('?')?'&':'?')+q.toString(),{cache:'no-store'})}catch(e){throw new Error('Sin conexión con Apps Script. Revisá internet o la URL.')}
  let j;try{j=await r.json()}catch(e){throw new Error('Apps Script no devolvió datos. Revisá que el acceso sea "Cualquier persona".')}
  if(!j.ok){if(/clave/i.test(j.error||''))setTimeout(config,1500);throw new Error(j.error||'Error')}
  return j.data;
}
function config(){
  S.tab='x';nav();$('#ttl').textContent='Configuración';
  $('#view').innerHTML=`<div class="card"><h2>Conexión</h2><p class="sub" style="margin-bottom:12px">Pegá la URL de la implementación de Apps Script (termina en /exec) y la clave que generó App_crearClave. Quedan guardadas solo en este iPhone.</p><input id="cu" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(CFG.get('url'))}" autocapitalize="off" autocorrect="off" style="background:#12161a"><input id="ck" type="password" placeholder="Clave" value="${esc(CFG.get('key'))}" autocapitalize="off" autocorrect="off" style="margin-top:6px;background:#12161a"><button class="chip on" style="width:100%;margin-top:10px" onclick="CFG.set('url',$('#cu').value.trim());CFG.set('key',$('#ck').value.trim());go('inicio',true)">Guardar y abrir</button></div>`;
}
// Monto en pesos (o en dólares si solo hay dólares)
const ppal=o=>!o?'—':(o.ars||!o.usd?money(o.ars):money(o.usd,'USD'));
// Línea secundaria en dólares cuando hay pesos y dólares
const usdSub=(o,cls)=>o&&o.ars&&o.usd?`<div class="${cls||'sub'}">${money(o.usd,'USD')}</div>`:'';

const COL=['#5db4fb','#ec7480','#6fdca5','#f3c969','#b48cf2','#f59e6c','#58d6d0','#e58fc5','#9db1bd'];
// Color fijo por categoría (siempre el mismo para la misma categoría)
const colCat=n=>{let h=0;for(const c of String(n||''))h=(h*31+c.charCodeAt(0))>>>0;return COL[h%COL.length]};
const IC={
 inicio:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 movs:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
 venc:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/>',
 activos:'<path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/>',
 mas:'<path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3.2"/>'};
const TABS=[['inicio','Inicio'],['movs','Movimientos'],['venc','Vencimientos'],['activos','Activos'],['mas','Más']];
// [texto, pestaña] o [texto, número de fase si todavía no existe]
const MENU=[['Tarjetas','tarj'],['Cuotas','cuotas'],['Préstamo','prest'],['Súper','super'],['Resumen Anual','anual'],['Consumos por categoría','consumos'],['Salario','salario'],['Inflación','ipc'],['Configuración','config']];
const S={tab:'inicio',mes:'',tipo:'Todos',q:'',mov:null,venc:null,cmes:'',cat:'',volver:'',cuo:null,dia:'',ssub:'',sup:null,smes:null,an:null,ames:'',sal:null,sali:-1,cq:null,cpm:null,cuom:''};
// Días hasta una fecha en palabras
const enDias=n=>n===0?'Hoy':n===1?'Mañana':n===-1?'Ayer':n<0?`Hace ${-n} días`:`En ${n} días`;
// Mes en curso 'aaaa-mm' según la hora del iPhone
const hoyK=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const mesCorto=k=>{const p=k.split('-');return new Date(p[0],p[1]-1,1).toLocaleDateString('es-AR',{month:'short'}).replace('.','')};

function nav(){
  $('#nav').innerHTML=TABS.map(t=>`<button class="${S.tab===t[0]||(t[0]==='venc'&&S.tab==='tarj')||(t[0]==='activos'&&S.tab==='ipc')?'on':''}" onclick="${t[0]==='mas'?'menu(true)':t[0]==='movs'?'verMovs()':`go('${t[0]}')`}"><svg viewBox="0 0 24 24">${IC[t[0]]}</svg>${t[1]}</button>`).join('');
}
function menu(on){
  $('#menu').innerHTML='<h2>Más pestañas</h2>'+MENU.map(m=>`<button onclick="menu(false);${typeof m[1]==='string'?`go('${m[1]}')`:`fase('${m[0]}',${m[1]})`}">${m[0]}</button>`).join('');
  $('#sheet').classList.toggle('on',on);
}
function fase(nombre,n){
  S.tab='x';nav();$('#ttl').textContent=nombre;
  $('#view').innerHTML=`<div class="empty"><b>${esc(nombre)}</b>Esta pantalla llega en la Fase ${n}.</div>`;
}
const cargando='<div class="empty">Cargando…</div>';
function falla(e){$('#view').innerHTML=`<div class="empty"><b>No se pudo cargar</b>${esc(e&&e.message||e)}<br><br><button class="chip on" onclick="go(S.tab,true)">Reintentar</button></div>`}

async function go(tab,fresh){
  S.tab=tab;nav();window.scrollTo(0,0);
  const v=$('#view');
  try{
    if(tab==='inicio'){
      $('#ttl').textContent='Inicio';v.innerHTML=cargando;
      v.innerHTML=vInicio(await run('App_inicio',!!fresh));
    }else if(tab==='movs'){
      $('#ttl').textContent='Movimientos';v.innerHTML=cargando;
      if(S.cat){
        const r=await Promise.all([run('App_movimientos',S.mes,!!fresh),run('App_cuotasMes',S.mes,!!fresh)]);
        S.mov=r[0];S.cuo=r[1];
        if(S.cuo.mes!==S.mov.mes)S.cuo=await run('App_cuotasMes',S.mov.mes,!!fresh);
      }else{S.mov=await run('App_movimientos',S.mes,!!fresh);S.cuo=null}
      S.mes=S.mov.mes;
      v.innerHTML=vMovs();if(S.cat)resCat();lista();
    }else if(tab==='venc'||tab==='tarj'){
      $('#ttl').textContent=tab==='venc'?'Vencimientos':'Tarjetas';v.innerHTML=cargando;
      S.venc=await run('App_vencimientos',!!fresh);
      v.innerHTML=vVenc(tab);
    }else if(tab==='cuotas'){
      $('#ttl').textContent='Cuotas';v.innerHTML=cargando;
      const r=await Promise.all([run('App_cuotas',!!fresh),run('App_cuotasPorMes',!!fresh)]);
      S.cq=r[0];S.cpm=r[1];if(!S.cpm.meses.find(m=>m.k===S.cuom))S.cuom=(S.cpm.meses[0]||{}).k||'';
      v.innerHTML=vCuotas(S.cq);
    }else if(tab==='prest'){
      $('#ttl').textContent='Préstamo';v.innerHTML=cargando;
      v.innerHTML=vPrest(await run('App_prestamo',!!fresh));
    }
    else{
      // Fase 3: [título, función del servidor, vista]
      const P={activos:['Activos','App_activos',vActivos],ipc:['Inflación','App_ipc',vIpc],super:['Súper','App_super',vSuper],
        anual:['Resumen Anual','App_resumenAnual',vAnual],consumos:['Consumos por categoría','App_resumenAnual',vConsumos],salario:['Salario','App_salario',vSalario]}[tab];
      if(tab==='config'){config();return}
      if(!P)return;
      $('#ttl').textContent=P[0];v.innerHTML=cargando;
      if(tab==='super'){S.ssub='';const r=await Promise.all([run('App_super',!!fresh),run('App_superMes',!!fresh)]);S.sup=r[0];S.smes=r[1];v.innerHTML=vSuper(S.sup);return}
      v.innerHTML=P[2](await run(P[1],!!fresh));
    }
  }catch(e){falla(e)}
}

function vInicio(d){
  // Saldo: el de Resumen Anual; si no está, ingresos − gastos
  let salLbl='Saldo',sal=d.sal;
  if(!sal&&d.ing&&d.gas){salLbl='Ingresos − gastos';sal={ars:d.ing.ars-d.gas.ars,usd:d.ing.usd-d.gas.usd}}
  const salCls=sal&&(sal.ars||sal.usd)<0?'neg':'';
  const tot=d.cats.reduce((a,c)=>a+c.v,0);
  let h=`<div class="hero"><small>Gastos de ${esc(mesTxt(d.mes).split(' ')[0].toLowerCase())}</small><b>${ppal(d.gas)}</b>${usdSub(d.gas,'usd')}</div>`;
  h+=`<div class="two"><div class="card"><small>Ingresos</small><b class="pos">${ppal(d.ing)}</b>${usdSub(d.ing)}</div>`;
  h+=`<div class="card"><small>${salLbl}</small><b class="${salCls}">${ppal(sal)}</b>${usdSub(sal)}</div></div>`;
  if(tot>0)h+=`<div class="card"><h2>${esc(d.catsTitulo)}</h2>${d.catsNota?`<p class="nota">${esc(d.catsNota)}</p>`:''}${dona(d.cats,tot,d.mes)}${d.cats.map((c,i)=>`<div class="row tap" data-cat="${esc(c.n)}" onclick="verCat(this.dataset.cat,'${d.mes}','inicio')"><span class="dot" style="background:${COL[i%COL.length]}"></span><div class="g"><div>${esc(c.n)}</div></div><div class="r">${money(c.v)}<div class="sub">${(c.v/tot*100).toFixed(1).replace('.',',')}%${c.usd?` · ${money(c.usd,'USD')}`:''}</div></div></div>`).join('')}</div>`;
  (d.secciones||[]).forEach(s=>{
    h+=`<div class="card"><h2>${esc(s.titulo)}</h2>${s.filas.map(f=>`<div class="row"><div class="g"><div>${esc(f.label)}</div></div><div class="r">${esc(f.texto)}</div></div>`).join('')}</div>`;
  });
  return h;
}
function dona(cats,tot,mes){
  const R=80,C=2*Math.PI*R;let off=0;
  const seg=cats.map((c,i)=>{const L=c.v/tot*C,g=Math.max(L-3,0.5);const s=`<circle${mes?` class="tap" data-cat="${esc(c.n)}" onclick="verCat(this.dataset.cat,'${mes}','inicio')"`:''} cx="100" cy="100" r="${R}" fill="none" stroke="${COL[i%COL.length]}" stroke-width="20" stroke-dasharray="${g} ${C-g}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;off+=L;return s}).join('');
  return `<div class="donut"><svg viewBox="0 0 200 200" width="200" height="200">${seg}</svg><div class="c"><div><span class="sub">Total</span><b>${money(tot)}</b></div></div></div>`;
}

// Tocar una categoría (Inicio o Consumos) abre Movimientos de ese mes filtrado
function verCat(n,mes,desde){S.cat=n;S.mes=mes||S.mes;S.tipo='Todos';S.q='';S.volver=desde||'';go('movs')}
function verMovs(){S.cat='';S.volver='';go('movs')}
function quitarCat(){S.cat='';S.volver='';S.cuo=null;$('#view').innerHTML=vMovs();lista()}
const mismaCat=(a,b)=>String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase();
function vMovs(){
  const m=S.mov;
  const filtro=S.cat?`<div class="tools">${S.volver?`<button class="chip" onclick="go(S.volver)">‹ Volver</button>`:''}<button class="chip on cat" onclick="quitarCat()"><span class="cdot" style="margin:0;background:${colCat(S.cat)}"></span>${esc(S.cat)}<span class="x">✕</span></button></div><div id="rescat"></div>`:'';
  return filtro+`<div class="tools"><select onchange="S.mes=this.value;go('movs')">${m.meses.map(k=>`<option value="${k}" ${k===m.mes?'selected':''}>${esc(mesTxt(k))}</option>`).join('')}</select>${['Todos','Gasto','Ingreso'].map(t=>`<button class="chip ${S.tipo===t?'on':''}" onclick="S.tipo='${t}';document.querySelectorAll('.tools .chip[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==='${t}'));lista()" data-t="${t}">${t==='Todos'?'Todos':t+'s'}</button>`).join('')}</div><div id="cal" class="card cal"></div><input id="q" type="search" placeholder="Buscar descripción, cuenta o categoría" oninput="S.q=this.value;lista()" value="${esc(S.q)}"><div id="lista"></div>`;
}
// Movimientos del mes con los filtros activos (categoría, tipo y búsqueda)
function filtrados(){
  const q=S.q.trim().toLowerCase();
  return S.mov.items.filter(x=>(!S.cat||mismaCat(x.cat,S.cat))&&(S.tipo==='Todos'||x.t===S.tipo)&&(!q||(x.d+' '+x.c+' '+x.cat).toLowerCase().includes(q)));
}
function lista(){
  const it=filtrados();
  calendario(it);
  if(!it.length){$('#lista').innerHTML=S.cat&&S.cuo&&S.cuo.items.some(c=>mismaCat(c.cat,S.cat))?'':'<div class="empty"><b>Sin movimientos</b>Probá con otro mes o quitá los filtros.</div>';return}
  let h='',dia='',abierto=false;
  it.forEach(x=>{
    if(x.f!==dia){if(abierto)h+='</div>';dia=x.f;h+=`<div class="dn" id="d-${x.f}">${esc(diaTxt(x.f))}</div><div class="card" style="padding:4px 16px">`;abierto=true}
    const ing=x.t==='Ingreso',otro=x.t!=='Ingreso'&&x.t!=='Gasto';
    const tipo=otro&&x.t?` · ${esc(x.t)}`:'';
    h+=`<div class="row"><div class="g"><div>${esc(x.d)}</div><div class="sub"><span class="cdot" style="background:${colCat(x.cat)}"></span>${esc(x.cat||'Sin categoría')} · ${esc(x.c)}${tipo}</div></div><div class="r ${ing?'pos':otro?'neu':''}">${ing?'+':''}${money(x.m,x.mon)}${x.q>1?`<div class="sub">${x.q} cuotas de ${money(x.vc,x.mon)}</div>`:''}</div></div>`;
  });
  $('#lista').innerHTML=h+'</div>';
}
// Calendario del mes: los días con movimientos (según los filtros activos) se pueden tocar
function calendario(it){
  const el=$('#cal');if(!el||!S.mes)return;
  const [y,mo]=S.mes.split('-').map(Number),n=new Date(y,mo,0).getDate(),ini=(new Date(y,mo-1,1).getDay()+6)%7;
  const hoy=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})();
  const por={};it.forEach(x=>{(por[x.f]=por[x.f]||[]).push(x)});
  let h='<div class="wd">'+['L','M','M','J','V','S','D'].map(d=>`<span>${d}</span>`).join('')+'</div><div class="ds">'+'<span></span>'.repeat(ini);
  for(let d=1;d<=n;d++){
    const f=S.mes+'-'+String(d).padStart(2,'0'),xs=por[f]||[];
    // Hasta 3 puntos con los colores de las categorías del día
    const cols=[...new Set(xs.map(x=>x.t==='Ingreso'?'var(--grn)':colCat(x.cat)))].slice(0,3);
    h+=`<button ${xs.length?`onclick="irDia('${f}')"`:'disabled'} class="${f===hoy?'hoy':''} ${f===S.dia?'on':''}" aria-label="${d}${xs.length?', '+xs.length+' movimientos':''}">${d}<i>${cols.map(c=>`<b style="background:${c}"></b>`).join('')}</i></button>`;
  }
  el.innerHTML=h+'</div>';
}
// Marca el día y baja hasta sus movimientos (no oculta los demás)
function irDia(f){
  S.dia=f;calendario(filtrados());
  const t=document.getElementById('d-'+f);if(!t)return;
  // Deja el día por debajo de la barra de estado del iPhone (zona borrosa), con aire arriba
  const safe=(parseFloat(getComputedStyle($('#app')).paddingTop)||14)-14;
  window.scrollTo({top:t.getBoundingClientRect().top+window.scrollY-Math.max(safe,54)-130,behavior:'smooth'});
  const c=t.nextElementSibling;if(c){c.classList.remove('flash');void c.offsetWidth;c.classList.add('flash')}
}
// Resumen de la categoría: igual que el Resumen Anual = Valor Cuota de los movimientos del mes + cuotas de Cuotas_Auto
function resCat(){
  const movs=S.mov.items.filter(x=>mismaCat(x.cat,S.cat));
  const ars=movs.filter(x=>x.mon!=='USD').reduce((a,x)=>a+x.vc,0),usd=movs.filter(x=>x.mon==='USD').reduce((a,x)=>a+x.vc,0);
  const cuo=S.cuo?S.cuo.items.filter(c=>mismaCat(c.cat,S.cat)):[],tc=cuo.reduce((a,c)=>a+c.v,0);
  let h=`<div class="hero"><small>${esc(S.cat)} en ${esc(mesTxt(S.mes).split(' ')[0].toLowerCase())}</small><b>${money(ars+tc)}</b>${usd?`<div class="usd">${money(usd,'USD')}</div>`:''}</div>`;
  h+=`<div class="card"><div class="kv"><span>Movimientos del mes (${movs.length})</span>${money(ars)}</div>${cuo.length?`<div class="kv"><span>Cuotas con tarjeta del mes (${cuo.length})</span>${money(tc)}</div>`:''}<p class="sub" style="margin-top:8px">Las compras en cuotas suman solo la cuota del mes, como en Consumos por categoría.</p></div>`;
  if(cuo.length)h+=`<details class="card"><summary>Cuotas con tarjeta de este mes ›</summary>${cuo.map(c=>`<div class="row"><div class="g"><div>${esc(c.n)}</div><div class="sub">${c.cuotas?c.cuotas+' cuotas · ':''}total ${money(c.total)}</div></div><div class="r">${money(c.v)}</div></div>`).join('')}</details>`;
  $('#rescat').innerHTML=h;
}
/* ---------- Fase 2: Vencimientos y Tarjetas ---------- */
const monto=(ars,usd)=>`${ars||!usd?money(ars):''}${usd?`<div class="${ars?'sub':''}">${money(usd,'USD')}</div>`:''}`;
function verVenc(tab){S.tab=tab;nav();$('#ttl').textContent=tab==='venc'?'Vencimientos':'Tarjetas';$('#view').innerHTML=vVenc(tab)}
function vVenc(tab){
  const d=S.venc;
  const seg=`<div class="seg"><button class="${tab==='venc'?'on':''}" onclick="verVenc('venc')">Vencimientos</button><button class="${tab==='tarj'?'on':''}" onclick="verVenc('tarj')">Tarjetas</button></div>`;
  return seg+(tab==='venc'?vVencLista(d):vTarjetas(d));
}
function vVencLista(d){
  let h=`<div class="hero"><small>Pendiente de pago</small><b>${money(d.totalPend.ars)}</b>${d.totalPend.usd?`<div class="usd">${money(d.totalPend.usd,'USD')}</div>`:''}</div>`;
  const fila=x=>{
    const late=!x.pagado&&x.dias<0,soon=!x.pagado&&x.dias>=0&&x.dias<=3;
    const tag=x.pagado?'':late?'<span class="tag red">Vencido</span>':soon?`<span class="tag blue">${enDias(x.dias)}</span>`:'';
    const sub=[x.cat,x.pagado||late||soon?'':enDias(x.dias),x.cierre?`cierra ${corto(x.cierre)}`:''].filter(Boolean).join(' · ');
    return `<div class="row"><div class="ic${late?' late':''}" style="font-size:12px;text-align:center;line-height:1.1">${esc(corto(x.f))}</div><div class="g"><div>${esc(x.item)}${tag}</div><div class="sub">${esc(sub)}</div></div><div class="r">${monto(x.ars,x.usd)}</div></div>`;
  };
  if(d.pendientes.length)h+=`<div class="card"><h2>Pendientes</h2>${d.pendientes.map(fila).join('')}</div>`;
  else h+='<div class="empty"><b>Todo pago</b>No hay vencimientos pendientes.</div>';
  if(d.pagados.length)h+=`<div class="card"><details><summary>Pagados (${d.pagados.length})</summary>${d.pagados.map(fila).join('')}</details></div>`;
  return h;
}
// Logo de la red de la tarjeta (Visa, Mastercard, Amex), dibujado en SVG con el estilo de la app
function logoRed(n){
  if(/master/i.test(n))return '<svg viewBox="0 0 40 40"><circle cx="15.5" cy="20" r="9" fill="#eb001b"/><circle cx="24.5" cy="20" r="9" fill="#f79e1b" fill-opacity=".9"/></svg>';
  if(/visa/i.test(n))return '<svg viewBox="0 0 40 40"><text x="20" y="25" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="900" font-style="italic" fill="#eef3f5" letter-spacing=".3">VISA</text><rect x="9" y="27.5" width="22" height="2" rx="1" fill="#f7b600"/></svg>';
  if(/amex|american/i.test(n))return '<svg viewBox="0 0 40 40"><rect x="4" y="10" width="32" height="20" rx="4" fill="#2e77bc"/><text x="20" y="23.6" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9.5" font-weight="900" fill="#fff" letter-spacing=".4">AMEX</text></svg>';
  return '<svg viewBox="0 0 40 40" fill="none" stroke="#8d99a1" stroke-width="2"><rect x="7" y="11" width="26" height="18" rx="3"/><path d="M7 17h26"/></svg>';
}
// Color de cada banco (si no está, uno fijo según el nombre)
const colBanco=b=>/galicia/i.test(b)?'#f58220':/patagonia/i.test(b)?'#1f6fb5':/naci[oó]n/i.test(b)?'#3a8fd6':/santander/i.test(b)?'#ec0000':/bbva|franc[eé]s/i.test(b)?'#1973b8':/macro/i.test(b)?'#3d7fc1':colCat(b);
function vTarjetas(d){
  if(!d.tarjetas.length)return '<div class="empty"><b>Sin tarjetas</b>No hay datos en la pestaña Tarjetas.</div>';
  const tot=d.tarjetas.reduce((a,t)=>({ars:a.ars+t.ars,usd:a.usd+t.usd}),{ars:0,usd:0});
  let h=`<div class="hero"><small>Resúmenes actuales</small><b>${money(tot.ars)}</b>${tot.usd?`<div class="usd">${money(tot.usd,'USD')}</div>`:''}</div>`;
  h+=d.tarjetas.map(t=>{
    const cerrada=t.cierre&&t.cierre<=d.hoy;
    const kv=[['Cierre',t.cierre?corto(t.cierre)+(cerrada?' (cerrado)':''):'—'],['Vencimiento',t.venc?corto(t.venc):'—']];
    if(t.pcierre)kv.push(['Próximo cierre',corto(t.pcierre)]);
    if(t.pvenc)kv.push(['Próximo vencimiento',corto(t.pvenc)]);
    return `<div class="card"><div class="row" style="padding-top:0"><div class="ic logo">${logoRed(t.n)}</div><div class="g"><div>${esc(t.n)}</div><div class="sub"><span class="cdot" style="background:${colBanco(t.banco)}"></span>${esc(t.banco)}</div></div><div class="r">${monto(t.ars,t.usd)}</div></div>${kv.map(x=>`<div class="kv"><span>${x[0]}</span>${esc(x[1])}</div>`).join('')}</div>`;
  }).join('');
  return h;
}

/* ---------- Fase 2: Cuotas ---------- */
function selCuota(i){S.cuom=S.cpm.meses[i].k;$('#view').innerHTML=vCuotas(S.cq)}
function vCuotas(d){
  const ms=(S.cpm&&S.cpm.meses)||[];
  if(!ms.length)return '<div class="empty"><b>Sin cuotas</b>No hay compras en cuotas en curso.</div>';
  const i=Math.max(0,ms.findIndex(m=>m.k===S.cuom)),m=ms[i],esHoy=m.k===S.cpm.mes;
  let h=`<div class="hero"><small>Cuotas de ${esc(mesTxt(m.k).split(' ')[0].toLowerCase())}${esHoy?'':' '+esc(m.k.slice(0,4))}</small><b>${money(m.v)}</b><div class="usd">${m.items.length} ${m.items.length===1?'compra':'compras'} en cuotas</div></div>`;
  h+=`<div class="card"><h2>Compromiso por mes</h2>${barras(ms.map(x=>({v:x.v,l:mesCorto(x.k)})),i,'selCuota')}<p class="sub" style="margin-top:6px">Tocá un mes para ver sus cuotas.</p></div>`;
  h+=`<div class="card"><h2>Cuotas de ${mesK(m.k).toLowerCase()}</h2>${m.items.map(x=>{
    const pct=x.cuotas&&x.nro?Math.round(x.nro/x.cuotas*100):0;
    const ult=x.nro&&x.nro===x.cuotas?'<span class="tag blue">Última</span>':'';
    return `<div class="row" style="display:block"><div style="display:flex;gap:12px;align-items:center"><div class="g"><div>${esc(x.n)}${ult}</div><div class="sub"><span class="cdot" style="background:${colCat(x.cat)}"></span>${esc(x.cat)}${x.nro?` · cuota ${x.nro} de ${x.cuotas}`:x.cuotas?` · ${x.cuotas} cuotas`:''}</div></div><div class="r">${money(x.v)}<div class="sub">de ${money(x.total)}</div></div></div><div class="prog"><i style="width:${pct}%"></i></div></div>`;
  }).join('')}</div>`;
  return h;
}

/* ---------- Fase 2: Préstamo ---------- */
function vPrest(d){
  const pagadas=d.total-d.restantes;
  let h=`<div class="hero"><small>Deuda pendiente</small><b>${money(d.adeudado)}</b><div class="usd">${d.restantes} de ${d.total} cuotas por pagar</div></div>`;
  h+=`<div class="card"><h2>Avance</h2><div class="kv"><span>Pagado</span>${money(d.pagado)}</div><div class="kv"><span>Deuda inicial</span>${money(d.inicial)}</div><div class="prog"><i style="width:${Math.min(100,d.pct)}%;background:var(--grn)"></i></div><div class="sub" style="margin-top:6px">${String(d.pct).replace('.',',')}% pagado · ${pagadas} cuotas</div></div>`;
  if(d.proxima){const p=d.proxima;h+=`<div class="card"><h2>Próxima cuota</h2><div class="row"><div class="ic${p.dias<0?' late':''}" style="font-size:12px;text-align:center;line-height:1.1">${esc(corto(p.f))}</div><div class="g"><div>Cuota ${p.n}</div><div class="sub${p.dias<0?' neg':''}">${p.dias<0?'Vencida · ':''}${enDias(p.dias)}</div></div><div class="r">${money(p.imp)}</div></div></div>`;}
  // "Total" de la planilla es la deuda antes de pagar esa cuota
  const fila=c=>`<div class="row"><div class="g"><div>Cuota ${c.n}</div><div class="sub">${esc(diaTxt(c.f))}</div></div><div class="r ${c.pagada?'neu':''}">${money(c.imp)}<div class="sub">después: ${money(c.saldo-c.imp)}</div></div></div>`;
  const pend=d.cuotas.filter(c=>!c.pagada),pag=d.cuotas.filter(c=>c.pagada);
  if(pend.length)h+=`<div class="card"><h2>Cuotas pendientes</h2>${pend.map(fila).join('')}</div>`;
  if(pag.length)h+=`<div class="card"><details><summary>Pagadas (${pag.length})</summary>${pag.map(fila).join('')}</details></div>`;
  return h;
}

/* ---------- Fase 3: helpers ---------- */
const pctNum=s=>{const n=parseFloat(String(s||'').replace(/[^0-9,\-]/g,'').replace(',','.'));return isNaN(n)?0:n};
const pctCls=s=>!s?'':(/^\s*-/.test(s)?'neg':'pos');
const mesK=k=>esc(mesTxt(k));
function seg2(a,b,on){return `<div class="seg"><button class="${on===a[0]?'on':''}" onclick="go('${a[0]}')">${a[1]}</button><button class="${on===b[0]?'on':''}" onclick="go('${b[0]}')">${b[1]}</button></div>`}
function barras(items,on,click){const max=Math.max(...items.map(m=>Math.abs(m.v)),1);return `<div class="bars${click?' tap':''}">${items.map((m,i)=>`<div class="${i===on?'on':''}"${click?` onclick="${click}(${i})"`:''}><i style="height:${Math.round(Math.abs(m.v)/max*100)}%"></i><small>${esc(m.l)}</small></div>`).join('')}</div>`}

/* ---------- Activos + Inflación ---------- */
function vActivos(d){
  let h=seg2(['activos','Activos'],['ipc','Inflación'],'activos');
  const ars=d.carteras.find(c=>/^cartera ars$/i.test(c.titulo));
  const kv=(c,k)=>{const f=c&&c.filas.find(x=>x.k.toLowerCase()===k);return f?f.v:''};
  if(ars){const r=kv(ars,'rendimiento %');h+=`<div class="hero"><small>Cartera en pesos</small><b>${esc(kv(ars,'capital actual'))}</b><div class="usd">Rendimiento ${esc(kv(ars,'rendimiento total'))} · <span class="${pctCls(r)}">${esc(r)}</span></div></div>`;}
  h+=d.carteras.filter(c=>c!==ars).map(c=>`<div class="card"><h2>${esc(c.titulo)}</h2>${c.filas.map(f=>`<div class="kv"><span>${esc(f.k)}</span>${esc(f.v)}</div>`).join('')}</div>`).join('');
  const fila=a=>{const sub=[a.tipo,a.ini?'desde '+corto(a.ini):'',a.venc?'vence '+corto(a.venc):'',a.tna?'TNA '+a.tna:''].filter(Boolean).join(' · ');
    return `<div class="row"><div class="g"><div>${esc(a.n)}</div><div class="sub">${esc(sub)}</div></div><div class="r">${money(a.act,a.mon)}<div class="sub"><span class="${pctCls(a.pct)}">${esc(a.pct||'—')}</span>${a.real?` · real <span class="${pctCls(a.real)}">${esc(a.real)}</span>`:''}</div></div></div>`};
  if(d.activos.length)h+=`<div class="card"><h2>Activos (${d.activos.length})</h2>${d.activos.map(fila).join('')}</div>`;
  else h+='<div class="empty"><b>Sin activos</b>No hay activos con estado Activo.</div>';
  if(d.cerrados.length)h+=`<div class="card"><details><summary>Cerrados (${d.cerrados.length})</summary>${d.cerrados.map(fila).join('')}</details></div>`;
  return h;
}
function vIpc(d){
  let h=seg2(['activos','Activos'],['ipc','Inflación'],'ipc');
  if(d.kpis.length)h+=`<div class="two">${d.kpis.map(k=>`<div class="card"><small>${esc(cap(k.k.toLowerCase()))}</small><b class="${/real|cartera/i.test(k.k)?pctCls(k.v):''}">${esc(k.v)}</b><div class="sub" style="margin-top:4px">${esc(k.nota)}</div></div>`).join('')}</div>`;

    h+=`<div class="card"><h2>IPC mensual ${esc(d.meses[0].k.slice(0,4))}</h2>${barras(d.meses.filter(m=>m.ipc).map(m=>({v:pctNum(m.ipc),l:mesCorto(m.k)})),-1)}${d.meses.slice().reverse().map(m=>`<div class="row"><div class="g"><div>${mesK(m.k)}${/curso/i.test(m.est)?'<span class="tag blue">En curso</span>':''}</div><div class="sub">IPC ${esc(m.ipc||'—')}${m.acum?' · acum. '+esc(m.acum):''}</div></div><div class="r">${m.cart?`<span class="${pctCls(m.cart)}">${esc(m.cart)}</span>`:'—'}<div class="sub">${m.realAcum?'real acum. '+esc(m.realAcum):'cartera'}</div></div></div>`).join('')}</div>`;
  }
  if(d.activos.length)h+=`<div class="card"><h2>Activos vs. inflación</h2>${d.activos.map(a=>`<div class="row"><div class="g"><div>${esc(a.n)}${a.des?`<span class="tag ${/gan/i.test(a.des)?'blue':'red'}">${esc(a.des)}</span>`:''}</div><div class="sub">${esc([a.tipo,a.nom?'nominal '+a.nom:'',a.ipc?'IPC '+a.ipc:''].filter(Boolean).join(' · '))}</div></div><div class="r ${pctCls(a.real)}">${esc(a.real||a.nom)}<div class="sub">${a.real?'real':'nominal'}</div></div></div>`).join('')}</div>`;

/* ---------- Súper ---------- */
function verSub(n){S.ssub=n;$('#view').innerHTML=vSuper(S.sup);window.scrollTo(0,0)}
function vSuper(d){
  if(S.ssub)return vSuperSub(d);
  const tot=d.subs.reduce((a,s)=>a+s.mes,0),anual=d.subs.reduce((a,s)=>a+s.anual,0);
  let h=`<div class="hero"><small>Súper en ${esc(mesTxt(d.mes).split(' ')[0].toLowerCase())}</small><b>${money(tot)}</b><div class="usd">En el año: ${money(anual)}</div></div>`;
  if(d.meses.length)h+=`<div class="card"><h2>Por mes</h2>${barras(d.meses.map(m=>({v:m.v,l:mesCorto(m.k)})),d.meses.findIndex(m=>m.k===d.mes))}</div>`;
  if(d.subs.length){const max=Math.max(...d.subs.map(s=>s.mes),1);
    h+=`<div class="card"><h2>Por subcategoría</h2><p class="nota">Tocá una subcategoría para ver sus productos del mes.</p>${d.subs.map(s=>`<div class="row tap" style="display:block" data-sub="${esc(s.n)}" onclick="verSub(this.dataset.sub)"><div style="display:flex;gap:12px"><div class="g"><div>${esc(s.n)}</div><div class="sub">En el año ${money(s.anual)}</div></div><div class="r">${money(s.mes)}</div></div><div class="prog"><i style="width:${Math.round(s.mes/max*100)}%;background:${colCat(s.n)}"></i></div></div>`).join('')}</div>`;}
  if(d.compras.length){
    h+='<h2 class="dn" style="font-size:15px;font-weight:600">Últimas compras</h2>'+comprasSuper(d.compras,true);
  }
  return h;
}
// Lista de compras del súper agrupada por día y comercio
function comprasSuper(cs,conSub){
  let h='',k='',abierto=false;
  cs.forEach(c=>{const key=c.f+'|'+c.com;
    if(key!==k){if(abierto)h+='</div>';k=key;h+=`<div class="dn">${esc(diaTxt(c.f))} · ${esc(c.com)}</div><div class="card" style="padding:4px 16px">`;abierto=true}
    h+=`<div class="row"><div class="g"><div>${esc(c.p)}</div>${conSub?`<div class="sub"><span class="cdot" style="background:${colCat(c.sub)}"></span>${esc(c.sub)}</div>`:''}</div><div class="r">${money(c.m)}</div></div>`;});
  return h+(abierto?'</div>':'');
}
// Productos de una subcategoría en el mes actual
function vSuperSub(d){
  const eq=(a,b)=>String(a).trim().toLowerCase()===String(b).trim().toLowerCase();
  const it=((S.smes&&S.smes.items)||[]).filter(c=>eq(c.sub,S.ssub)),s=d.subs.find(x=>eq(x.n,S.ssub));
  const tot=s?s.mes:it.reduce((a,c)=>a+c.m,0);
  let h=`<div class="tools"><button class="chip" onclick="S.ssub='';$('#view').innerHTML=vSuper(S.sup)">‹ Volver</button><button class="chip on cat" onclick="S.ssub='';$('#view').innerHTML=vSuper(S.sup)"><span class="cdot" style="margin:0;background:${colCat(S.ssub)}"></span>${esc(S.ssub)}<span class="x">✕</span></button></div>`;
  h+=`<div class="hero"><small>${esc(S.ssub)} en ${esc(mesTxt(d.mes).split(' ')[0].toLowerCase())}</small><b>${money(tot)}</b><div class="usd">${it.length} ${it.length===1?'producto':'productos'}${s?' · en el año '+money(s.anual):''}</div></div>`;
  h+=it.length?comprasSuper(it,false):'<div class="empty"><b>Sin productos este mes</b>No hay compras de esta subcategoría en el mes.</div>';
  return h;
}

/* ---------- Resumen Anual ---------- */
function selAnual(i){S.ames=S.an.meses[i].k;$('#view').innerHTML=vAnual(S.an)}
function vAnual(d){
  S.an=d;
  if(!d.meses.length)return '<div class="empty"><b>Sin datos</b>No hay meses cargados en Resumen Anual.</div>';
  const hoy=hoyK();
  if(!d.meses.find(m=>m.k===S.ames))S.ames=(d.meses.find(m=>m.k===hoy)||d.meses[d.meses.length-1]).k;
  const i=d.meses.findIndex(m=>m.k===S.ames),m=d.meses[i];
  let h=`<div class="hero"><small>Saldo de ${esc(mesTxt(m.k).split(' ')[0].toLowerCase())}</small><b class="${m.sal&&m.sal.ars<0?'neg':''}">${ppal(m.sal)}</b>${usdSub(m.sal,'usd')}</div>`;
  h+=`<div class="card"><h2>Gasto por mes</h2>${barras(d.meses.map(x=>({v:x.gas?x.gas.ars:0,l:mesCorto(x.k)})),i,'selAnual')}<p class="sub" style="margin-top:6px">Tocá un mes para ver su detalle.${d.corte?` Desde el ${esc(d.corte)} el gasto cuenta el pago de las tarjetas, no cada compra.`:''}</p></div>`;
  h+=`<div class="card"><h2>${mesK(m.k)}</h2><div class="kv"><span>Ingreso</span><div class="r pos">${ppal(m.ing)}${usdSub(m.ing)}</div></div><div class="kv"><span>Gasto</span><div class="r">${ppal(m.gas)}${usdSub(m.gas)}</div></div><div class="kv"><span>Saldo</span><div class="r ${m.sal&&m.sal.ars<0?'neg':''}">${ppal(m.sal)}${usdSub(m.sal)}</div></div></div>`;
  const cats=m.cats.filter(c=>!/^pago tarjeta$/i.test(c.n));
  if(cats.length)h+=`<div class="card"><h2>Principales consumos</h2>${cats.slice(0,4).map(c=>`<div class="row tap" data-cat="${esc(c.n)}" onclick="verCat(this.dataset.cat,'${m.k}','anual')"><span class="dot" style="background:${colCat(c.n)}"></span><div class="g"><div>${esc(c.n)}</div></div><div class="r">${money(c.v)}</div></div>`).join('')}<button class="chip" style="width:100%;margin-top:10px;background:#2d373e" onclick="S.cmes='${m.k}';go('consumos')">Ver todas las categorías</button></div>`;
  return h;
}

/* ---------- Consumos por categoría ---------- */
function vConsumos(d){
  const ms=d.meses.filter(m=>m.cats.length);
  if(!ms.length)return '<div class="empty"><b>Sin datos</b>No hay consumos por categoría cargados.</div>';
  if(!S.cmes||!ms.find(m=>m.k===S.cmes))S.cmes=ms[ms.length-1].k;
  const i=ms.findIndex(m=>m.k===S.cmes),m=ms[i],prev=ms[i-1];
  const cats=m.cats.filter(c=>!/^pago tarjeta$/i.test(c.n)),pt=m.cats.find(c=>/^pago tarjeta$/i.test(c.n));
  const tot=cats.reduce((a,c)=>a+c.v,0),max=Math.max(...cats.map(c=>c.v),1);
  const ant=n=>{const c=prev&&prev.cats.find(x=>x.n===n);return c?c.v:null};
  let h=`<div class="tools"><select onchange="S.cmes=this.value;go('consumos')">${ms.slice().reverse().map(x=>`<option value="${x.k}" ${x.k===m.k?'selected':''}>${mesK(x.k)}</option>`).join('')}</select></div>`;
  h+=`<div class="hero"><small>Consumo de ${esc(mesTxt(m.k).split(' ')[0].toLowerCase())}</small><b>${money(tot)}</b><div class="usd">Incluye las cuotas con tarjeta del mes</div></div>`;
  h+=`<div class="card"><h2>Por categoría</h2><p class="nota">Tocá una categoría para ver sus movimientos.</p>${cats.map(c=>{const a=ant(c.n),dif=a?Math.round((c.v-a)/a*100):null;
    return `<div class="row tap" style="display:block" data-cat="${esc(c.n)}" onclick="verCat(this.dataset.cat,'${m.k}','consumos')"><div style="display:flex;gap:12px"><div class="g"><div>${esc(c.n)}</div><div class="sub">${(c.v/tot*100).toFixed(1).replace('.',',')}%${dif!=null?` · <span class="${dif>0?'neg':'pos'}">${dif>0?'+':''}${dif}%</span> vs. mes anterior`:''}</div></div><div class="r">${money(c.v)}${c.usd?`<div class="sub">${money(c.usd,'USD')}</div>`:''}</div></div><div class="prog"><i style="width:${Math.round(c.v/max*100)}%;background:${colCat(c.n)}"></i></div></div>`}).join('')}</div>`;
  if(pt)h+=`<div class="card"><div class="kv"><span>Pago de tarjetas (sale de la cuenta)</span>${money(pt.v)}</div></div>`;
  return h;
}

/* ---------- Salario ---------- */
function selSal(i){S.sali=i;$('#view').innerHTML=vSalario(S.sal)}
function vSalario(d){
  S.sal=d;
  const k=d.kpis;let h='';
  if(k[0])h+=`<div class="hero"><small>${esc(cap(k[0].k.toLowerCase()))}</small><b>${esc(k[0].v)}</b><div class="usd">${esc(k[0].n1)}${k[0].n2?' · '+esc(k[0].n2):''}</div></div>`;
  if(k.length>1)h+=`<div class="two">${k.slice(1).map(x=>`<div class="card"><small>${esc(cap(x.k.toLowerCase()))}</small><b>${esc(x.v)}</b><div class="sub" style="margin-top:4px">${esc(x.n1)}</div></div>`).join('')}</div>`;
  if(d.hist.length){
    // Por defecto el período del mes en curso; si no está, el último cargado
    if(S.sali<0||S.sali>=d.hist.length){const act=mesTxt(hoyK()).toLowerCase();const j=d.hist.findIndex(x=>String(x.p).trim().toLowerCase()===act);S.sali=j>=0?j:d.hist.length-1}
    const x=d.hist[S.sali];
    h+=`<div class="card"><h2>Evolución del neto</h2>${barras(d.hist.map(x=>({v:x.neto,l:x.p.slice(0,3).toLowerCase()+' '+x.p.slice(-2)})),S.sali,'selSal')}<p class="sub" style="margin-top:6px">Tocá un mes para ver su detalle.</p></div>`;
    h+=`<div class="card"><h2>${esc(x.p)}</h2><div class="kv"><span>Neto</span><b>${money(x.neto)}</b></div><div class="kv"><span>Bruto</span>${money(x.bruto)}</div><div class="kv"><span>Descuentos</span>${money(x.desc)}</div><div class="kv"><span>Aumento</span><span class="${x.inc&&x.inc!=='0,00%'?'pos':''}">${x.inc&&x.inc!=='0,00%'?'+'+esc(x.inc):'—'}</span></div></div>`;
  }
  const prox=d.sim.find(s=>/pr[oó]ximo/i.test(s.p)),dif=d.sim.find(s=>/diferencia/i.test(s.p));
  if(prox)h+=`<div class="card"><h2>Próximo aumento (simulado)</h2><div class="kv"><span>Aumento</span>${esc(prox.inc)}</div><div class="kv"><span>Neto proyectado</span>${money(prox.neto)}</div>${dif?`<div class="kv"><span>Diferencia de bolsillo</span><span class="pos">+${money(dif.neto)}</span></div>`:''}<div class="kv"><span>Bruto proyectado</span>${money(prox.bruto)}</div></div>`;
  return h;
}

nav();if(CFG.get('url')&&CFG.get('key'))go('inicio');else config();

</script>
